services:
  db:
    image: postgres:16
    container_name: ammct_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cricket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricket}
      POSTGRES_DB: ${POSTGRES_DB:-cricket_dev}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cricket} -d ${POSTGRES_DB:-cricket_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ammct_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional lightweight DB admin UI. Run with: docker compose --profile tools up -d
  adminer:
    image: adminer
    container_name: ammct_adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db_data:
  redis_data:
