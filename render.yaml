databases:
  - name: cricket-db
    plan: free
    postgresMajorVersion: "16"

services:
  # NestJS API. Runs pending TypeORM migrations before starting each deploy
  # — never uses synchronize:true in production (DB_SYNCHRONIZE is left
  # unset, which the app's config.ts defaults to false).
  - type: web
    name: cricket-backend
    runtime: node
    plan: free
    rootDir: .
    # --include=dev: Render sets NODE_ENV=production for the build step by
    # default, which makes a plain `npm install` skip devDependencies —
    # breaking `nest build` (needs @nestjs/cli) and, later, `migration:run`
    # (needs ts-node via typeorm-ts-node-commonjs). Forcing dev deps in at
    # build time avoids that; the app's own runtime NODE_ENV (set below)
    # is unaffected either way since node_modules isn't reinstalled at start.
    buildCommand: npm install --include=dev && npm run build --workspace=apps/backend
    # Runs migrations against the already-compiled dist/database/data-source.js
    # instead of `npm run migration:run` (which uses typeorm-ts-node-commonjs —
    # recompiling TypeScript via ts-node on every single boot). That added
    # real, avoidable latency to every cold start on top of Render free tier's
    # own sleep/wake delay — this only compiles once, at build time.
    startCommand: npx typeorm migration:run -d apps/backend/dist/database/data-source.js && npm run start:prod --workspace=apps/backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cricket-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set to the deployed web dashboard's exact origin (e.g.
      # https://cricket-dashboard.onrender.com) once its URL is known —
      # Render assigns the subdomain at first deploy, so it can't be
      # wired automatically here. Falls back to '*' (open) until set.
      - key: CORS_ORIGIN
        value: "*"
      # Resend — sends the "Forgot password" OTP email via HTTPS API (see
      # MailService's doc comment for why not raw SMTP: Render's outbound
      # network silently blocks SMTP ports, confirmed via a real deploy).
      # RESEND_API_KEY uses sync:false so the actual secret is never
      # committed to git; set its real value once in the Render dashboard
      # instead.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_NAME
        value: "Cricket League"
      # onboarding@resend.dev is Resend's sandbox sender, usable without
      # domain verification but restricted to sending TO the Resend
      # account's own signup address. Once itsdigitalindia.co.in is
      # verified in Resend, change this to an address on that domain to
      # send to any recipient.
      - key: MAIL_FROM_EMAIL
        value: "onboarding@resend.dev"

  # Vite-built React admin dashboard, served as a static site. VITE_API_BASE_URL
  # is baked in at build time, so it must be set to the backend's real URL
  # (from the service above) BEFORE this service's first build — set it in
  # the Render dashboard once the backend URL is known, then trigger a deploy.
  - type: web
    name: cricket-web-dashboard
    runtime: static
    rootDir: .
    # Same --include=dev reasoning as cricket-backend above — vite,
    # typescript, and @tailwindcss/vite are all devDependencies.
    buildCommand: npm install --include=dev && npm run build --workspace=apps/web
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: ""
    routes:
      # SPA client-side routing — every path serves index.html, React Router
      # takes it from there.
      - type: rewrite
        source: /*
        destination: /index.html
