org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true

# Kotlin's incremental compiler crashes ("this and base files have different
# roots") when computing relative paths between files on different Windows
# drive letters — here, the project (D:\Ammct) vs. the pub cache
# (C:\Users\...\Pub\Cache). Disabling incremental compilation avoids the
# crash entirely; the tradeoff is slightly slower Kotlin recompiles.
kotlin.incremental=false
